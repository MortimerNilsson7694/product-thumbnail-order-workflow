[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-thumbnail-order-workflow"
version = "0.1.0"
description = "Generate product thumbnails while advancing a typed e-commerce order workflow."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
